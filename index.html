<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PBB TKE Barajas</title>

<style>
:root{--bg:#f6f2fa;--card:#fff;--tx:#1d1526;--mu:#6d6478;--pr:#7a12b5;--ac:#f0700a;--g:linear-gradient(90deg,#7a12b5,#f0700a);--prt:#fff;--ok:#7a12b5;--wa:#7a12b5;--bd:#e3dbec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#130d1c;--card:#1e1530;--tx:#f3edf9;--mu:#a597b8;--pr:#a14fe0;--ac:#ff8a2b;--prt:#fff;--ok:#a14fe0;--wa:#a14fe0;--bd:#35264c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:3px solid var(--ac);border-image:var(--g) 1;color:var(--tx);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:17px;margin:0}header small{opacity:.85;display:block;font-size:12px}
header>div:nth-child(2){flex:1;min-width:0}.logo{width:50px;height:auto;flex:none}header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px!important}.btn:disabled{opacity:.35;filter:grayscale(1)}details>summary::after{content:" ▾"}details[open]>summary::after{content:" ▴"}.hb{display:flex;gap:6px;margin-left:8px;flex:none}#out,#mo,#modo,#adm{width:32px;height:32px;padding:0!important;border-radius:50%!important;font-weight:700;display:flex;align-items:center;justify-content:center}#mo.on,#adm.on,#modo.on{background:var(--g)!important;color:#fff!important;border-color:transparent!important}.row{flex-wrap:wrap}#out,#mo,#modo,#adm{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:6px 12px;font-size:13px}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{text-align:center}.kpi b{font-size:28px;display:block}
.btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 8px;color:var(--tx);font-size:14px;font-weight:600;width:100%}
.btn span{font-size:26px}
.pri{background:var(--g);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;width:100%}
.sec{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--pr);color:var(--prt)}
.ab,.ce{font-size:11px;letter-spacing:.6px;font-weight:700;padding:2px 8px;border-radius:3px}.ab{background:var(--pr);color:var(--prt)}.ce{border:1px solid var(--mu);color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;line-height:1.15;background:none;border:0;color:var(--mu);padding:8px 2px;font-size:11px}nav button span{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:700}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}
#sheet>div{background:var(--card);width:100%;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
iframe{width:100%;height:70vh;border:1px solid var(--bd);border-radius:10px;background:#fff}

 ({dash:vDash,new:vNew,track:vTrack,plans:vPlans,tec:vTec})[view]();

function card(i){

 return `<div class="card"><div class="row"><b>PBB ${i.pos} <span class="tag">${i.tipo}</span></b><span class="${ab?"ab":"ce"}">${ab?"ABIERTA":"CERRADA"}</span></div>

 <div class="mu">${i.fecha} · Reportado por: ${esc(i.rep)}</div>${i.equipos&&i.equipos.length?`<div class="mu"><b>Equipos:</b> ${esc(i.equipos.join(", "))}</div>`:""}${i.turno?`<div class="mu"><b>Turno:</b> ${esc(i.turno)} · ${esc(i.tecnico||"")}</div>`:""}
 ${i.desc?`<p style="margin:6px 0">${esc(i.desc)}</p>`:""}
 <div class="mu">Inicio ${i.hIni||"–"}${ab?"":` · Llegada ${i.hLle||"–"} · Cierre ${i.hCie||"–"}`}</div>
 ${i.aap?`<div class="mu"><b>Equipo AAP:</b> ${esc(i.aap)}${i.alarmas&&i.alarmas.length?` · <b>Alarma:</b> ${esc(i.alarmas.join(", "))}`:""}</div>`:""}${i.def?`<div class="mu"><b>Definición:</b> ${esc(i.def)}</div>`:""}${i.com?`<div class="mu"><b>Comentario:</b> ${esc(i.com)}</div>`:""}<div class="gfrow">${i.guiada?`<details style="margin-top:6px" ${guiAb.has(i.id)?"open":""} ontoggle="togGui('${i.id}',this.open)"><summary class="sec" style="display:inline-block;padding:8px 14px;cursor:pointer;font-weight:600">Actuación guiada</summary><div style="margin-top:8px">${guiBloques(i)}</div></details>`:""}</div>${i.plc?`<img src="${i.plc}" alt="PLC" style="width:100%;max-height:170px;object-fit:cover;border-radius:6px;margin-top:6px">`:""}${i.act?`<div class="mu"><b>Actuación:</b> ${esc(i.act)}</div>`:""}${i.obs?`<div class="mu"><b>Obs.:</b> ${esc(i.obs)}</div>`:""}
 ${ab&&(tecnico||admin)&&view!="dash"?`<button class="pri" style="padding:9px;width:100%;margin-top:8px" onclick="resolver('${i.id}')">Cerrar / Resolver</button>`:""}
 <div class="cacts"><span class="cacl">${admin||tecnico?`<button class="sec" onclick="editar('${i.id}')">Editar</button>`:""}${admin?`<button class="sec" onclick="borrar('${i.id}')">Eliminar</button>`:""}</span><span class="cacr">${view=="track"?`${ab?`<button class="sec gwr" title="Inspección cable a cable" aria-label="Inspección cable a cable de esta OT" onclick="insOT('${i.id}')">${IC('mult')}</button>${i.tipo=="PAS"?`<button class="sec gwr gplc" title="Módulos PLC" aria-label="Módulos PLC de esta OT" onclick="insMods('${i.id}')"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="${P.plc}"/></svg></button>`:""}`:""}${(tecnico||admin)&&i.tipo=="PAS"?`${i.plc?`<button class="sec gdl2" title="Borrar foto PLC" aria-label="Borrar foto PLC" onclick="delOT('${i.id}')">${IC('trash')}</button>`:""}<button class="sec gfb2" onclick="gFotoOT('${i.id}')">${IC('cam')}FOTO PLC</button>`:""}`:""}</span></div></div>`;
}

 <div class="grid" style="margin-bottom:10px"><button class="btn" onclick="go('new')"><span>${IC('plus')}</span>Registrar OT</button>
 <button class="btn" onclick="resTec()" ${tecnico||admin?"":"disabled"}><span>${IC('check')}</span>Resolución OT</button>

function vNew(){ultTipo="PAS";
 $("#app").innerHTML=`<div class="card"><h3 style="margin:0 0 4px">Registrar incidencia</h3>
 <label>Posición PBB</label><select id="f_pos">${POS.map(p=>`<option value="${p}">${p}</option>`).join("")}</select>
 <label>Tipo de incidencia</label><div class="pbbw"><div class="pbbd"><img src="${SIL}" alt="Pasarela PBB">${EQ.map(e=>`<span class="ptag ${e.k=="PAS"?"on":""}" data-k="${e.k}" style="left:${e.x}%;top:${e.y}%" onclick="togEq('${e.k}')">${e.k}</span>`).join("")}</div><div class="pchk">${EQ.map(e=>`<label><input type="checkbox" class="eqc" value="${e.k}" ${e.k=="PAS"?"checked":""} onchange="pintaEq()">${e.k}</label>`).join("")}</div></div>
 <label>Número de orden (CGA)</label><div style="display:flex;align-items:stretch"><span id="pf_v" style="display:flex;align-items:center;padding:0 12px;background:var(--pr);color:var(--prt);border-radius:6px 0 0 6px;font-weight:700;letter-spacing:1px">${pref}</span><div style="display:flex;flex-direction:column;width:38px"><button type="button" onclick="cambiaPref(1)" aria-label="Subir" style="flex:1;background:var(--pr);color:var(--prt);border:0;border-left:1px solid #fff5;border-bottom:1px solid #fff5;font-size:12px;padding:0">▲</button><button type="button" onclick="cambiaPref(-1)" aria-label="Bajar" style="flex:1;background:var(--pr);color:var(--prt);border:0;border-left:1px solid #fff5;font-size:12px;padding:0">▼</button></div><input id="f_ord" inputmode="numeric" maxlength="3" placeholder="000" oninput="this.value=this.value.replace(/[^0-9]/g,'')" style="border-radius:0 6px 6px 0;letter-spacing:3px;font-weight:600"></div><div class="mu" style="margin-top:4px">Introduce solo los 3 últimos dígitos</div>
 <label>Reportado por</label><select id="f_rep" onchange="$('#f_otro').classList.toggle('hide',this.value!='Otro')"><option>CGA</option><option>Responsable Turno</option><option>Otro</option></select>

 <button class="pri" style="margin-top:14px" onclick="guardar()">Guardar incidencia</button></div>`;
}
function guardar(){
 const d3=$("#f_ord").value.trim();if(!/^[0-9]{3}$/.test(d3)){msg("Introduce los 3 últimos dígitos del número de orden");return}const orden=pref+d3;
 if(!orden){msg("Introduce el número de orden de CGA");return}
 if(!$("#f_pos").value){msg("Elige una PBB del terminal");return}

 let rep=$("#f_rep").value;if(rep=="Otro")rep="Otro: "+($("#f_otro").value.trim()||"s/d");
 inc.unshift({id:Date.now()+"",pos:String($("#f_pos").value).replace(/\s*·\s*remota$/,""),tipo:(document.querySelector(".eqc:checked")||{}).value||"PAS",equipos:[...document.querySelectorAll(".eqc:checked")].map(x=>x.value),orden,rep,desc:$("#f_desc").value.trim(),hIni:$("#f_hi").value,hLle:"",hCie:"",act:"",obs:"",fecha:hoy(),estado:"abierta"});
 sv("pbb_inc",inc);go("dash");
}

const san=n=>n.replace(/[^\w.\-]/g,"_").toLowerCase();
async function subir(fs){
 const lista=Array.from(fs);const ex=await allPdf();let n=0;const rep=[],par=[],fail=[];
 for(const f of lista){
  if(ex.some(x=>san(x.name)==san(f.name))){rep.push(f.name);continue}
  const sim=ex.find(x=>x.size&&x.size==f.size);
  const t=f.type||(/\.pdf$/i.test(f.name)?"application/pdf":"");
  const path=Date.now()+"_"+f.name.replace(/[^\w.\-]/g,"_");
  const up=b=>sb.storage.from("planos").upload(path,b,{contentType:t||undefined});
  const intentos=[()=>up(f),async()=>up(new Blob([await f.arrayBuffer()],{type:t})),async()=>up(await fetch(URL.createObjectURL(f)).then(r=>r.blob()))];
  let r=null,err="";
  for(const it of intentos){try{r=await it();if(!r.error)break;err=r.error.message;if(!/network|load failed|failed to fetch/i.test(err))break}catch(e){err=((e&&e.name)?e.name+": ":"")+((e&&e.message)||e);r=null}}
  if(r&&!r.error){n++;ex.push({name:f.name,size:f.size});if(sim)par.push(f.name+" ≈ "+sim.name)}
  else fail.push(f.name+" → "+(err||"error desconocido"));
 }
 const inp=$("#pf");if(inp)inp.value="";
 if(rep.length||par.length||fail.length){
  $("#sheetc").innerHTML=`<h3 style="margin:0">Resultado de la subida</h3>`+
   (n?`<div style="margin-top:8px">Subidos correctamente: <b>${n}</b></div>`:"")+
   (fail.length?`<label>No se han podido subir</label><div>${fail.map(esc).join("<br>")}</div><div class="mu" style="margin-top:6px">Si indica NotReadableError o Load failed: el archivo no está descargado en el iPhone (iCloud) o pesa demasiado. Descárgalo en Archivos y vuelve a elegirlo.</div>`:"")+
   (rep.length?`<label>Ya existían, no se han subido</label><div>${rep.map(esc).join("<br>")}</div>`:"")+
   (par.length?`<label>Posible repetido (mismo tamaño), se ha subido igualmente</label><div>${par.map(esc).join("<br>")}</div>`:"")+
   `<button class="pri" style="margin-top:14px" onclick="closeSheet()">Entendido</button>`;
  $("#sheet").style.display="flex";
 }else if(n)msg(n+" documento(s) cargado(s)");
 vPlans()}

 const r=await sb.rpc("verificar_tecnico",{p_id:tecSel.id,p_codigo:$("#t_c").value});

async function altaTec(){const n=$("#g_n").value.trim(),t=$("#g_t").value,c=$("#g_c").value.trim();
 if(!n){msg("Escribe el nombre");return}if(c.length<4){msg("El código debe tener al menos 4 caracteres");return}
 const r=await sb.from("tecnicos").insert({nombre:n,turno:t,codigo:c}).select("id");
 if(r.error||!r.data||!r.data.length){msg("No se pudo dar de alta: "+((r.error&&r.error.message)||"sin permiso"));return}
 msg(n+" dado de alta en el turno "+t);gesTec()}
async function bajaTec(id){const r=await sb.from("tecnicos").delete().eq("id",id).select("id");if(r.error||!r.data||!r.data.length){msg("No se pudo eliminar");return}msg("Técnico eliminado");gesTec()}
async function codTec(id){
 $("#sheetc").innerHTML=`<h3 style="margin:0">Nuevo código</h3><label>Código (mín. 4)</label><input id="g_nc" type="password" inputmode="numeric" autocomplete="new-password"><button class="pri" style="margin-top:12px" onclick="guardaCodTec('${id}')">Guardar</button><button class="sec" style="width:100%;margin-top:8px" onclick="gesTec()">Volver</button>`}
async function guardaCodTec(id){const c=$("#g_nc").value.trim();if(c.length<4){msg("Mínimo 4 caracteres");return}
 const r=await sb.from("tecnicos").update({codigo:c}).eq("id",id).select("id");if(r.error||!r.data||!r.data.length){msg("No se pudo cambiar el código");return}msg("Código actualizado");gesTec()}

function identificado(){return !!(turno&&tecNombre)}
function claveN(n){return String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").trim().replace(/\s+/g," ").toUpperCase()}
function unicos(l){const m=new Map();for(const x of l){const k=claveN(x.nombre);if(k&&!m.has(k))m.set(k,String(x.nombre).trim())}return [...m.values()].sort((a,b)=>a.localeCompare(b,"es"))}

 $("#sheetc").innerHTML=`<h3 style="margin:0">Añadir Técnico</h3><div class="mu" style="margin-top:8px">Cargando…</div>`;$("#sheet").style.display="flex";

 $("#sheetc").innerHTML=`<div class="row" style="flex-wrap:nowrap"><h3 style="margin:0">Añadir Técnico</h3><button class="sec" onclick="closeSheet()" style="padding:4px 12px">✕</button></div>
 <label>Nombre del técnico</label><input id="g_n" autocomplete="off"><div class="grid"><div><label>Turno</label><select id="g_t"><option>Mañana</option><option>Tarde</option><option>Noche</option></select></div><div><label>Código (mín. 4)</label><input id="g_c" type="password" inputmode="numeric" autocomplete="new-password"></div></div>

function ltTog(){ltOpen=!ltOpen;pintaLT()}
function ltPick(k){ltSel=ltSel==k?"":k;pintaLT()}
function pintaLT(){const r=window._tecAll||{data:[]},b=$("#ltb"),box=$("#ltbox");if(!b||!box)return;
 if(r.err){b.textContent="Listado Técnicos ▾";box.innerHTML=ltOpen?`<div class="mu" style="margin-top:10px">No se pudo cargar la lista (${esc(r.err)}).</div>`:"";return}
 const g=new Map();for(const x of r.data){const k=claveN(x.nombre);if(!k)continue;if(!g.has(k))g.set(k,{k,n:String(x.nombre).trim(),l:[]});g.get(k).l.push(x)}
 const gs=[...g.values()].sort((a,b)=>a.n.localeCompare(b.n,"es")),ord=["Mañana","Tarde","Noche"];
 b.textContent=`Listado Técnicos (${gs.length}) ${ltOpen?"▴":"▾"}`;b.setAttribute("aria-expanded",ltOpen);
 if(!ltOpen){box.innerHTML="";return}
 box.innerHTML=`<div class="ltl">`+(gs.map(o=>{const ab=ltSel==o.k;o.l.sort((a,b)=>ord.indexOf(a.turno)-ord.indexOf(b.turno));
  return `<div class="lti"><button class="ltn" data-k="${esc(o.k)}" onclick="ltPick(this.dataset.k)"><span style="overflow-wrap:anywhere">${esc(o.n)}</span><span class="mu">${ab?"▴":"▾"}</span></button>`+(ab?`<div class="ltd">`+o.l.map(x=>`<div class="row" style="flex-wrap:nowrap;margin:6px 0"><span class="mu">Turno ${esc(x.turno)}</span><span style="white-space:nowrap"><button class="sec" style="padding:6px 10px" onclick="codTec('${x.id}')">Código</button> <button class="sec" style="padding:6px 10px" onclick="bajaTec('${x.id}')">Eliminar</button></span></div>`).join("")+`</div>`:"")+`</div>`}).join("")||`<div class="mu" style="padding:12px">Sin técnicos dados de alta</div>`)+`</div>`}

  if(!s){tab=null;continue}

function iaGRefs(txt,R){

 (R.pasos||[]).forEach(p=>{const s=p.t+" "+p.sub.join(" ");Object.values(refs).forEach(r=>{const re=new RegExp("\\b"+r.id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\d.])");if(re.test(s))r.pasos.add(p.n)})});

function iaGZona(id){const pre=id.split("-")[0],ty=(id.split("-")[1]||"")[0];

  let k=j-1;while(k>=0&&j-k<9&&!/^(DIS|DIN)\d\d$/.test(items[k]))k--;if(k<0||j-k>=9)return "";

  (S.p||[]).forEach(q=>{const T=F[q.f];if(!T)return;const txt=String(q.p||"").toUpperCase();
