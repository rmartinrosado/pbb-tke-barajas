<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PBB TKE Barajas</title>
<style>
:root{--bg:#f6f2fa;--card:#fff;--tx:#1d1526;--mu:#6d6478;--pr:#7a12b5;--ac:#f0700a;--g:linear-gradient(90deg,#7a12b5,#f0700a);--prt:#fff;--ok:#7a12b5;--wa:#7a12b5;--bd:#e3dbec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#130d1c;--card:#1e1530;--tx:#f3edf9;--mu:#a597b8;--pr:#a14fe0;--ac:#ff8a2b;--prt:#fff;--ok:#a14fe0;--wa:#a14fe0;--bd:#35264c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:3px solid var(--ac);border-image:var(--g) 1;color:var(--tx);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:17px;margin:0}header small{opacity:.85;display:block;font-size:12px}
header>div:nth-child(2){flex:1;min-width:0}.logo{width:50px;height:auto;margin-right:10px;flex:none}header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px!important}.btn:disabled{opacity:.35;filter:grayscale(1)}.hb{display:flex;gap:6px;margin-left:8px;flex:none}#out,#mo,#modo,#adm{width:32px;height:32px;padding:0!important;border-radius:50%!important;font-weight:700;display:flex;align-items:center;justify-content:center}#mo.on,#adm.on,#modo.on{background:var(--g)!important;color:#fff!important;border-color:transparent!important}.row{flex-wrap:wrap}#out,#mo,#modo,#adm{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:6px 12px;font-size:13px}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{text-align:center}.kpi b{font-size:28px;display:block}
.btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 8px;color:var(--tx);font-size:14px;font-weight:600;width:100%}
.btn span{font-size:26px}
.pri{background:var(--g);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;width:100%}
.sec{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:var(--pr);color:var(--prt)}
.ab,.ce{font-size:11px;letter-spacing:.6px;font-weight:700;padding:2px 8px;border-radius:3px}.ab{background:var(--pr);color:var(--prt)}.ce{border:1px solid var(--mu);color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 2px;font-size:11px}nav button span{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:700}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}
#sheet>div{background:var(--card);width:100%;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
iframe{width:100%;height:70vh;border:1px solid var(--bd);border-radius:10px;background:#fff}

let mem=[],pdfDoc=null,pg=1,zm=1,cur="",busy=false;
function idb(){return new Promise(r=>{try{const q=indexedDB.open("pbb2",1);q.onupgradeneeded=()=>q.result.createObjectStore("docs",{keyPath:"id"});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);q.onblocked=()=>r(null)}catch(e){r(null)}})}
async function allPdf(){const d=await idb();if(!d)return mem;return new Promise(r=>{try{const q=d.transaction("docs").objectStore("docs").getAll();q.onsuccess=()=>r(q.result.concat(mem));q.onerror=()=>r(mem)}catch(e){r(mem)}})}
async function putDoc(o){const d=await idb();if(d){const ok=await new Promise(r=>{try{const t=d.transaction("docs","readwrite");t.objectStore("docs").put(o);t.oncomplete=()=>r(true);t.onerror=()=>r(false);t.onabort=()=>r(false)}catch(e){r(false)}});if(ok)return true}mem.push(o);return false}
async function subir(fs){let off=false;for(const f of fs){try{const buf=await f.arrayBuffer();const ok=await putDoc({id:Date.now()+"_"+Math.random().toString(36).slice(2),name:f.name,type:f.type||(/\.pdf$/i.test(f.name)?"application/pdf":""),data:buf});if(!ok)off=true}catch(e){msg("No se pudo leer "+f.name)}}
 msg(off?"Guardado solo durante esta sesión (el navegador no permite almacenamiento)":"Documento cargado");vPlans()}

 const l=await allPdf();
 $("#pl").innerHTML=l.map(p=>`<div class="card row"><span style="overflow-wrap:anywhere">${esc(p.name)}</span><span style="white-space:nowrap"><button class="sec" onclick="ver('${p.id}')">Ver</button>${admin?` <button class="sec" onclick="delPdf('${p.id}')">Eliminar</button>`:""}</span></div>`).join("")||'<div class="card mu">Aún no hay documentos.</div>';
}
function cargaLib(){return new Promise((res,rej)=>{if(window.pdfjsLib){res();return}const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res()};s.onerror=rej;document.head.appendChild(s)})}
function ctr(){$("#vc").innerHTML=`<button class="sec" onclick="nav(-1)">‹</button><span class="mu">${cur=="pdf"?pg+" / "+pdfDoc.numPages:""}</span><button class="sec" onclick="nav(1)">›</button><span><button class="sec" onclick="zoom(-.25)">−</button> <button class="sec" onclick="zoom(.25)">+</button></span>`}
function nav(d){if(cur!="pdf")return;const n=pg+d;if(n<1||n>pdfDoc.numPages)return;pg=n;drawPg()}
function zoom(d){zm=Math.min(4,Math.max(.5,zm+d));if(cur=="pdf")drawPg();else $("#vw img").style.width=zm*100+"%"}
async function drawPg(){if(busy)return;busy=true;try{const p=await pdfDoc.getPage(pg);const w=$("#vw").clientWidth;const b=p.getViewport({scale:1});const sc=w/b.width*zm,dp=window.devicePixelRatio||1;const v=p.getViewport({scale:sc*dp});let c=$("#vw canvas");if(!c){c=document.createElement("canvas");$("#vw").innerHTML="";$("#vw").appendChild(c)}c.width=v.width;c.height=v.height;c.style.width=v.width/dp+"px";c.style.height=v.height/dp+"px";await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise;ctr()}finally{busy=false}}
async function ver(id){
 const p=(await allPdf()).find(x=>x.id==id);if(!p)return;if(!p.data){const dl=await sb.storage.from("planos").download(p.id);if(dl.error){msg("No se pudo abrir");return}p.data=await dl.data.arrayBuffer();if(!p.type)p.type=dl.data.type||"application/pdf"}
 const blob=new Blob([p.data],{type:p.type||"application/pdf"});const u=URL.createObjectURL(blob);const isImg=(p.type||"").startsWith("image/");zm=1;
 $("#pv").innerHTML=`<div class="card"><div class="row"><b style="overflow-wrap:anywhere">${esc(p.name)}</b><a href="${u}" target="_blank" download="${esc(p.name)}" style="color:var(--pr)">Abrir / Descargar</a></div><div class="row" style="margin:8px 0" id="vc"></div><div id="vw" style="overflow:auto;max-height:70vh;border:1px solid var(--bd);background:#888;text-align:center"></div></div>`;
 $("#pv").scrollIntoView();
 try{
  if(isImg){cur="img";const r=new FileReader();r.onload=()=>{$("#vw").innerHTML=`<img src="${r.result}" style="width:100%">`;ctr()};r.readAsDataURL(blob)}
  else{cur="pdf";await cargaLib();pdfDoc=await pdfjsLib.getDocument({data:new Uint8Array(p.data.slice(0))}).promise;pg=1;await drawPg()}
 }catch(e){$("#vw").innerHTML=`<div style="padding:14px;background:var(--card)" class="mu">No se pudo mostrar el visor integrado. Usa «Abrir / Descargar».</div>`;$("#vc").innerHTML=""}
}
