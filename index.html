const san=n=>n.replace(/[^\w.\-]/g,"_").toLowerCase();
async function subir(fs){
 const lista=Array.from(fs);const ex=await allPdf();let n=0;const rep=[],par=[],fail=[];
 for(const f of lista){
  if(ex.some(x=>san(x.name)==san(f.name))){rep.push(f.name);continue}
  const sim=ex.find(x=>x.size&&x.size==f.size);
  const t=f.type||(/\.pdf$/i.test(f.name)?"application/pdf":"");
  const path=Date.now()+"_"+f.name.replace(/[^\w.\-]/g,"_");
  const up=b=>sb.storage.from("planos").upload(path,b,{contentType:t||undefined});
  const intentos=[()=>up(f),async()=>up(new Blob([await f.arrayBuffer()],{type:t})),async()=>up(await fetch(URL.createObjectURL(f)).then(r=>r.blob()))];
  let r=null,err="";
  for(const it of intentos){try{r=await it();if(!r.error)break;err=r.error.message;if(!/network|load failed|failed to fetch/i.test(err))break}catch(e){err=((e&&e.name)?e.name+": ":"")+((e&&e.message)||e);r=null}}
  if(r&&!r.error){n++;ex.push({name:f.name,size:f.size});if(sim)par.push(f.name+" ≈ "+sim.name)}
  else fail.push(f.name+" → "+(err||"error desconocido"));
 }
 const inp=$("#pf");if(inp)inp.value="";
 if(rep.length||par.length||fail.length){
  $("#sheetc").innerHTML=`<h3 style="margin:0">Resultado de la subida</h3>`+
   (n?`<div style="margin-top:8px">Subidos correctamente: <b>${n}</b></div>`:"")+
   (fail.length?`<label>No se han podido subir</label><div>${fail.map(esc).join("<br>")}</div><div class="mu" style="margin-top:6px">Si indica NotReadableError o Load failed: el archivo no está descargado en el iPhone (iCloud) o pesa demasiado. Descárgalo en Archivos y vuelve a elegirlo.</div>`:"")+
   (rep.length?`<label>Ya existían, no se han subido</label><div>${rep.map(esc).join("<br>")}</div>`:"")+
   (par.length?`<label>Posible repetido (mismo tamaño), se ha subido igualmente</label><div>${par.map(esc).join("<br>")}</div>`:"")+
   `<button class="pri" style="margin-top:14px" onclick="closeSheet()">Entendido</button>`;
  $("#sheet").style.display="flex";
 }else if(n)msg(n+" documento(s) cargado(s)");
 vPlans()}

async function altaTec(){const n=$("#g_n").value.trim(),t=$("#g_t").value,c=$("#g_c").value.trim();
 if(!n){msg("Escribe el nombre");return}if(c.length<4){msg("El código debe tener al menos 4 caracteres");return}
 const r=await sb.from("tecnicos").insert({nombre:n,turno:t,codigo:c}).select("id");
 if(r.error||!r.data||!r.data.length){msg("No se pudo dar de alta: "+((r.error&&r.error.message)||"sin permiso"));return}
 msg(n+" dado de alta en el turno "+t);gesTec()}
async function bajaTec(id){const r=await sb.from("tecnicos").delete().eq("id",id).select("id");if(r.error||!r.data||!r.data.length){msg("No se pudo eliminar");return}msg("Técnico eliminado");gesTec()}

function identificado(){return !!(turno&&tecNombre)}
function claveN(n){return String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").trim().replace(/\s+/g," ").toUpperCase()}
function unicos(l){const m=new Map();for(const x of l){const k=claveN(x.nombre);if(k&&!m.has(k))m.set(k,String(x.nombre).trim())}return [...m.values()].sort((a,b)=>a.localeCompare(b,"es"))}

function pintaLT(){const r=window._tecAll||{data:[]},b=$("#ltb"),box=$("#ltbox");if(!b||!box)return;
 if(r.err){b.textContent="Listado Técnicos ▾";box.innerHTML=ltOpen?`<div class="mu" style="margin-top:10px">No se pudo cargar la lista (${esc(r.err)}).</div>`:"";return}
 const g=new Map();for(const x of r.data){const k=claveN(x.nombre);if(!k)continue;if(!g.has(k))g.set(k,{k,n:String(x.nombre).trim(),l:[]});g.get(k).l.push(x)}
 const gs=[...g.values()].sort((a,b)=>a.n.localeCompare(b.n,"es")),ord=["Mañana","Tarde","Noche"];
 b.textContent=`Listado Técnicos (${gs.length}) ${ltOpen?"▴":"▾"}`;b.setAttribute("aria-expanded",ltOpen);
 if(!ltOpen){box.innerHTML="";return}
 box.innerHTML=`<div class="ltl">`+(gs.map(o=>{const ab=ltSel==o.k;o.l.sort((a,b)=>ord.indexOf(a.turno)-ord.indexOf(b.turno));
  return `<div class="lti"><button class="ltn" data-k="${esc(o.k)}" onclick="ltPick(this.dataset.k)"><span style="overflow-wrap:anywhere">${esc(o.n)}</span><span class="mu">${ab?"▴":"▾"}</span></button>`+(ab?`<div class="ltd">`+o.l.map(x=>`<div class="row" style="flex-wrap:nowrap;margin:6px 0"><span class="mu">Turno ${esc(x.turno)}</span><span style="white-space:nowrap"><button class="sec" style="padding:6px 10px" onclick="codTec('${x.id}')">Código</button> <button class="sec" style="padding:6px 10px" onclick="bajaTec('${x.id}')">Eliminar</button></span></div>`).join("")+`</div>`:"")+`</div>`}).join("")||`<div class="mu" style="padding:12px">Sin técnicos dados de alta</div>`)+`</div>`}

"QUÉ HAY (ESQUEMA GENERAL rev. J folio 41, todas las posiciones salvo 504, 507 y 508): FINALES DE CARRERA MECÁNICOS, DOS POR LADO (superior e inferior) EN SERIE y SIN RELÉS. Túnel interior izquierdo: IT-S3''(SUP) + IT-S3''(INF) → hilo 743. Túnel interior derecho: IT-S3'(SUP) + IT-S3'(INF) → hilo 744. Túnel medio (PBB de 3 túneles): izquierdo MT-S3''(SUP/INF) → hilo 745; derecho MT-S3'(SUP/INF) → hilo 746. Se alimentan con el 24 V de seguridad (hilo 613, E-X68:6) desde la clema del túnel. Final pulsado = se abre el bucle de ese lado.",
"ENTRADAS EN E-A9 (folio 69): CADA LADO TIENE SU ENTRADA. Interior izquierdo = módulo 3, borna 5.1 (IN05S, LED 1); interior derecho = módulo 3, borna 6.1 (IN06S, LED 2); medio izquierdo = módulo 1, borna 2.1 (LED 2); medio derecho = módulo 4, borna 8.1 (LED 2). En reposo los LED están ENCENDIDOS: el LED apagado indica el lado activado.",
"POSICIONES 504, 507 y 508 (planos PBB 504 pág. 98-99): BARRERAS ÓPTICAS SICK L41 con entrada propia por lado: túnel interior izq IT-B1 → E-A9 módulo 3, 5.1–5.2; dcha IT-B2 → módulo 3, 6.1–6.2; túnel medio izq MT-B1 → módulo 1, 2.1–2.2; dcha MT-B2 → módulo 4, 8.1–8.2.",
"PRIORIDAD 1 · Inspeccionar los antiatrapamientos DERECHO e IZQUIERDO: comprobar que no hay objetos pulsando el final de carrera o interrumpiendo la barrera (objetos atrapados, suciedad, cables, golpes en el soporte).",
"PRIORIDAD 1 · Si está activado, liberarlo. Final de carrera: retirar el objeto y comprobar que la palanca o el rodillo vuelve libre y que vuelve a encenderse el LED de ese lado en E-A9. Barrera óptica (504, 507, 508): limpiar la óptica y realinear. Comprobar que se enciende el LED en E-A9.",
"PRIORIDAD 1 · Resetear o inicializar la PBB desde el pupitre.",
"PRIORIDAD 1 · Selector CP-S16: pasar de REMOTO a LOCAL y después otra vez a REMOTO para dejar la PBB en estado de reposo (E-A10 módulo 4, borna 7.1: modo local/remoto).",
"PRIORIDAD 2 · Si sigue activado el antiatrapamiento del túnel B por golpeo en la caja del aire acondicionado de cabina: identificar el lado contactado mirando qué LED de E-A9 está apagado (módulo 3: LED 1 = izquierdo, 5.1 · LED 2 = derecho, 6.1).",
"PRIORIDAD 2 · Puentear SOLO el lado activado (el otro sigue protegido). Finales mecánicos (rev. J): unir el 613 con el retorno de ese lado en la clema del túnel (izquierdo hilo 743, derecho hilo 744; medio izq. 745, medio dcha. 746) o, en el armario E, unir E-X68:6 (613) con la borna IN de ese lado en E-A9 (5.1 izquierdo, 6.1 derecho; 2.1 / 8.1 túnel medio). Barreras ópticas 504/507/508: lado IZQUIERDO = 5.1–5.2; lado DERECHO = 6.1–6.2.",
"PRIORIDAD 2 · Antes de puentear, medir: con el final cerrado, la borna IN del lado tiene 24 V del 613. Si en esa posición el bucle sale de la salida de test (UT) y no del 613, puentear IN–UT de ese canal.",
"PRIORIDAD 2 · Barreras ópticas (504/507/508): puentear siempre la entrada con su propia salida de test del mismo módulo (IN–UT); un puente a +24 V directo lo detecta el módulo safety como fallo.",
"PRIORIDAD 2 · Rearmar la PBB, comprobar movimientos, señalizar el puente en el armario y anotarlo en la OT (lado, bornas y motivo) para su retirada al reparar la caja de A/A o el final de carrera."],r:"Esquema general rev. J folios 41, 69, 70 · PBB 504 pág. 98-99"},
   {t:"No traslada / fallo variador",g:[49, 31, 58, 64, 30, 61, 59, 32, 61],p:["Anotar el código de alarma del display.","E-A0 disyuntor variadores apagado → E-Q1 disparado (22 A). Medir aislamiento de T-M1/T-M2 y cables ETR-W1/W2 antes de rearmar.","E-A2 DIN02/DIN03 apagado = fallo variador U1/U2. Leer código en E-U1/E-U2 y hacer reset quitando mando.","¿Entra E-K1 al pedir marcha? (bobina desde E-A6 DOS01). Si no → ver «no rearma».","Freno: E-K24 (E-A6 DOS02) alimenta T-Y1/T-Y2 por E-Q24 (6 A). Medir tensión en el freno con orden de marcha.","Freno manual T-S6/T-S8: E-A3 DIN10/12 deben estar encendidos; comprobar palanca de desfrenado.","«Freno perdido» encendido con PBB parada → freno no actúa: revisar frenos y relé R2 del variador.","Fallo sobretensión bus → medir resistencias de frenado E-R1/E-R2 (82 Ω 150 W).","Inductivos M12 límite giro H-B3/H-B4 y contaje H-B1/H-B2: LED del sensor y distancia a la pieza metálica que detecta (1 mm < distancia < 4 mm)."],r:"pág. 31-33, 54, 58-61"},
   {t:"Límite de traslación · inductivos de final de giro izq./dcha. · almena (giro de ruedas)",cro:"almena",g:[61,61,61,61,61,61,61,61,61,61,61,61,61,61,68,61,84],a:"El contaje no se puentea: el PLC necesita los pulsos de la almena para saber el ángulo de las ruedas. El límite de giro solo con autorización y ruedas comprobadas a la vista. Ajustar el límite al tope de diseño: no ampliarlo más allá.",p:[
"PRIORIDAD 1 · ACTUACIÓN MÁS EFICAZ ante límite de traslación: ajustar los inductivos de FINAL DE GIRO IZQUIERDO (H-B3) y DERECHO (H-B4). Si la PBB no traslada o no deja girar las ruedas hasta el final hacia un lado, lo más probable es que el inductivo de límite de ese lado actúe antes de tiempo: soporte movido, distancia fuera de 1-4 mm o mal situado frente al final de la almena.",
"PRIORIDAD 1 · Paso 1 · Identificar el lado: en E-A3 módulo 4, LED 1 (H-B3 izq., borna 7.1) y LED 2 (H-B4 dcha., borna 8.1) están ENCENDIDOS en reposo. Con la PBB limitada, el LED apagado indica el lado que corta. Anotar en la Magelis el ángulo de ruedas al que corta.",
"PRIORIDAD 1 · Paso 2 · En MANUAL, a baja velocidad y con un compañero mirando el carro: girar las ruedas hacia cada lado y anotar el ángulo al que se apaga cada LED. Los dos límites deben cortar simétricos respecto al centro; el que corta antes es el desajustado.",
"PRIORIDAD 1 · Paso 3 · Ajuste del inductivo del lado afectado: aflojar la contratuerca, dejar 1 mm < distancia < 4 mm a la almena, a 2 mm como el resto (medido en campo 29/10/2026) y situar el sensor o su soporte para que detecte el final de la almena justo en el tope de giro de diseño, no antes. Apretar tuerca y contratuerca y comprobar que el soporte no tiene holgura.",
"PRIORIDAD 1 · Paso 4 · Comprobación: girar de tope a tope; el LED del sensor y el de E-A3 deben cambiar a la vez y solo en el tope. Después, traslación completa en los dos sentidos sin bloqueo. El FC mecánico de traslación H-S1 sigue protegiendo por detrás.",
"PRIORIDAD 1 · Paso 5 · Anotar en la OT el lado, el ángulo de corte antes y después y el ajuste hecho. Si con el inductivo bien ajustado sigue limitando, NO ampliar el límite: seguir con el contaje H-B1/H-B2 (pulsos perdidos = ángulo erróneo), la almena dañada, el cableado (PRIORIDAD 2) o el FC H-S1.",
"QUÉ HAY (folio 61 y fotos de campo): la ALMENA es una banda cilíndrica de inox abrazada a la columna giratoria del tren de ruedas, bajo la corona de giro, con 13 pestañas hacia abajo y un RESALTE hacia fuera en cada extremo. En el soporte fijo solo hay 5 elementos: arriba UN final de carrera de rodillo H-S1 (paro de giro en los dos sentidos, lo pisan los resaltes) y debajo 4 inductivos en dos columnas × dos filas: fila alta límite (banda lisa) y fila baja contaje (pestañas). Inductivos SICK M12 PNP: LÍMITE DE GIRO (H-B3 izquierdo · H-B4 derecho) y CONTAJE (H-B1 izquierdo · H-B2 derecho). Con la almena y los inductivos el PLC conoce la situación de las ruedas y su ángulo respecto a la vertical (eje de la pasarela).",
"CABLEADO (folio 61). Alimentación común a los 4 sensores: +24 V hilo 189 (H-X51:26-27, pin 1 BN) y 0 V hilo 205 (H-X51:30, pin 3 BU). Salida Q PNP en el pin 2 (BK); el pin 4 no se usa. H-B3 límite izq.: latiguillo H-W16 → H-X51:18 → EH-W1 18 → E-X55:18 → hilo 281 → E-A3 borna 7.1 (DIN13). H-B4 límite dcha.: H-W17 → H-X51:19 → E-X55:19 → hilo 282 → E-A3 8.1 (DIN14). H-B1 contaje izq.: H-W14 → H-X51:16 → E-X55:16 → hilo 283 → E-A3 7.4 (DIN15). H-B2 contaje dcha.: H-W15 → H-X51:17 → E-X55:17 → hilo 284 → E-A3 8.4 (DIN16).",
"LED EN REPOSO, E-A3 módulo 4: LED 1 límite izq. ● · LED 2 límite dcha. ● · LED 3 contaje izq. y LED 4 contaje dcha. ◐ (encendido o apagado según dónde haya quedado la almena; al girar las ruedas parpadean, un cambio por cada almena).",
"PRIORIDAD 1 · Inspección visual en el carro: almena limpia (grasa de la corona que gotea sobre la banda, barro, hielo), sin pestañas dobladas ni resaltes golpeados, tornillo de la abrazadera apretado, rodillo del FC libre y sin grasa pegada, tornillería apretada y sin holgura en el giro. Sensores firmes en su soporte, tuerca y contratuerca apretadas, latiguillo M12 sin cortes ni tirones en el giro.",
"PRIORIDAD 1 · AJUSTE INDUCTIVO–ALMENA: 1 mm < distancia < 4 mm entre la cara del sensor y la almena, en TODO el giro. Valor medido en campo: 2 mm; dejarlo así para tener margen. Comprobar girando las ruedas de tope a tope: si en algún punto roza o se va por encima de 4 mm, la almena está descentrada o alabeada → corregir la almena, no solo el sensor.",
"PRIORIDAD 1 · Prueba de giro en MANUAL, a baja velocidad y con un compañero mirando el carro: el LED del propio sensor y el LED de E-A3 deben cambiar a la vez. Contaje: cambio regular con cada almena, sin saltos ni pulsos perdidos. Límite: se apaga solo al llegar al tope de giro de ese lado y vuelve a encenderse al salir.",
"PRIORIDAD 2 · Medidas: 24 V entre H-X51:27 (189) y H-X51:30 (205) en la caja de elevación. En el sensor, pin 2 conmuta 24 V / 0 V al pasar la almena. Mismo valor en H-X51:16-19, en E-X55:16-19 y en las bornas de E-A3 (7.1 · 8.1 · 7.4 · 8.4). Cambia el LED del sensor y no el de E-A3 → latiguillo, regleta H-X51 / E-X55 o manguera EH-W1 (24×1,5). No cambia el LED del sensor → ajuste fuera de 1-4 mm, almena sucia o sensor dañado.",
"SÍNTOMAS: sin pulsos de contaje → el PLC pierde el ángulo de las ruedas (no traslada o gira mal, falla el retorno autónomo). Límite apagado sin estar en el tope → la PBB no deja girar las ruedas hacia ese lado. Contaje que cuenta de más o de menos → sensor demasiado lejos (> 4 mm) o almena dañada.",
"FC DE TRASLACIÓN H-S1 · límite de giro (rodillo en el mismo soporte de los inductivos; plano: E-A8 DIS05 «F.C. TRASLACION», folios 42 y 68): uno solo para los dos sentidos, lo pisan los resaltes de los extremos de la almena unos grados después del inductivo de límite. Bucle safety: E-A8 UT1 borna 5.2 → hilo 285 RD → E-X55:13 → caja de elevación → contacto NC del FC → E-X55:12 → hilo 625 RD → E-A8 IN05S borna 5.1. LED DIS05 (mód. 3 LED 1) ● en reposo; apagado = FC pisado o bucle abierto y la PBB queda parada. Medir: 24 V pulsados de test en 5.2 y en E-X55:13; con el FC libre, lo mismo en E-X55:12 y en 5.1. Falta en E-X55:12 con 5.2 bien → FC pisado/dañado o manguera EH-W1. Liberar girando al lado contrario en manual y comprobar el inductivo de límite de ese lado: si el FC llegó a abrir, el inductivo no cortó a tiempo.",
"PUENTE PROVISIONAL (solo LÍMITE, con autorización, ruedas comprobadas a la vista y compañero vigilando): unir el + de la entrada con la entrada del lado afectado en E-A3, límite izq. 7.2 con 7.1 · límite dcha. 8.2 con 8.1. El FC de traslación H-S1 sigue protegiendo. Señalizarlo y anotarlo en la OT. El CONTAJE no se puentea.",
"PUENTE PROVISIONAL DEL FC H-S1 (solo con FC roto o rodillo dañado, con autorización, inductivos de límite H-B3/H-B4 comprobados y compañero vigilando las ruedas): en E-A8 unir IN05S 5.1 con su salida de test UT1 5.2 (nunca a +24 V directo: el módulo safety lo da como fallo). Los inductivos de límite siguen cortando. Señalizarlo y anotarlo en la OT.",
"SUSTITUCIÓN: inductivo SICK M12 PNP con la salida usada en el pin 2 (comprobar en la etiqueta antes de montar). Ajustar 1 mm < distancia < 4 mm, probar el giro completo de tope a tope y una traslación. 507: plano propio (folio 84), mismas entradas E-A3 DIN13-16 con alimentación 218/129 y latiguillos HH-W14…HH-W17."],r:"pág. 61, 68 (504/508 y rev. J) · 507 pág. 84"},
   {t:"No sube / no baja (elevación)",g:[34, 65, 44, 44, 58],p:["E-A0 disyuntor bomba apagado → E-Q3 disparado (11,4 A). Revisar motor H-M1 y cable H-W13.","¿Entra E-K3 al pedir subir? (bobina desde E-A6 DOS08).","Válvulas H-Y1 subir / H-Y2 bajar (24 V) por relés E-K61 / E-K62. Medir 24 V en la válvula con la orden; si llega y no actúa → bobina.","Bajada rápida: H-Y3 (24 V) y H-Y4/H-Y5 (12 V) desde E-A7.","Límites inclinación IT-S2/IT-S3 (E-A2 DIN04/05) y medidor de altura C-B14 (E-A4, 4-20 mA)."],r:"pág. 34, 44, 62"},
   {t:"Cabina / brazo autonivelador / suelo basculante",g:[35, 87, 35, 27],p:["Giro cabina: P-Q6 (1,3 A) → P-K61/2 → C-M1. En P-A4 disyuntor e inversores cabina encendidos.","Límites cabina C-B1/C-B2 y freno cabina C-B24 (P-A6). Potenciómetro giro C-R10 → E-R10 → E-A4.","Brazo autonivelador: P-Q5 (0,2 A) → P-K51/2 → C-M2. Sensores C-B8…C-B13 (P-A5); en reposo arriba 1 y 2 encendidos.","Suelo basculante: P-Q7 (1,6 A) → P-K71/2 → C-M5 (condensador P-C1). FC suelo C-S1/C-S2 (P-A6)."],r:"pág. 27, 35, 62, 84-88"},
   {t:"Fallo de autonivelación · sensores neutrales del brazo autonivelador",cro:"brazo",g:[86,86,86,86,86,86,35,35,86],a:"No se puentean los sensores del brazo autonivelador: son los que nivelan la cabina con la puerta del avión.",p:[
"QUÉ HAY (ESQUEMA GENERAL rev. J pág. 86): 6 inductivos SICK IME12-04BPSZC0K (M12, PNP, NC, alcance 4 mm) leídos por P-A5. Arriba: C-B9 (sensor 1 → DIN11, borna 5.4) y C-B8 (sensor 2 → DIN10, borna 6.1). Abajo: C-B11 (sensor 1 → DIN13, borna 7.1) y C-B10 (sensor 2 → DIN12, borna 6.4). NEUTRAL: C-B12 (sensor 1 → DIN14, borna 8.1) y C-B13 (sensor 2 → DIN15, borna 7.4). Contacto avión C-B7 → DIN09 (5.1).",
"LED EN REPOSO (brazo recogido), P-A5: arriba 1 y 2 ENCENDIDOS · abajo 1 y 2 apagados · neutral 1 y 2 apagados (módulo 4, LED 2 y 3).",
"PRIORIDAD 1 · Selector en MANUAL, cabina separada del avión o operación asegurada. Llevar el brazo a la posición central (0 mm): los DOS LED neutral de P-A5 (DIN14 8.1 = C-B12 · DIN15 7.4 = C-B13) deben quedar APAGADOS a la vez (sensores NC tapados por la leva) y encenderse los dos al salir de neutral hacia arriba o hacia abajo. Si uno no acompaña al otro → ese sensor (C-B12 o C-B13), su latiguillo o su leva (ajuste 1-4 mm).",
"PRIORIDAD 1 · Mirar el LED del propio sensor en la cabina. Cambia el LED del sensor y no el de P-A5 → latiguillo M12 (C-W4x), conector C-CON10 o manguera P-W10 (12×1,5). No cambia el LED del sensor → distancia a la leva (ajuste 1 mm < distancia < 4 mm), leva suelta o sucia, sensor dañado.",
"PRIORIDAD 1 · Medir en el conector del sensor: 24 V entre pin 1 (BN) y pin 3 (BU); la salida pin 4 (BK) conmuta 24 V / 0 V al pasar la leva. Común 24 V / 0 V por P-X92:8-9.",
"Comprobar que no hay dos posiciones a la vez (p. ej. neutral y arriba encendidos): leva desplazada o sensor flojo en su soporte.",
"El brazo no se mueve: P-Q5 (0,2 A) disparado (P-A4 módulo 3, LED 3 apagado) → revisar motor C-M2 y manguera P-W22 (P-X55:1-4) antes de rearmar.",
"Inversor P-K51/2 mandado por P-A1 «brazo autonivelador adelante / atrás». Bumper del brazo C-B27/C-B28 (E-A10 módulo 1, LED 1) debe estar encendido.",
"Sustitución: mismo modelo SICK 1040763 IME12-04BPSZC0K. Ajustar distancia, probar ciclo arriba → neutral → abajo y comprobar LED en P-A5. Caso registrado: PBB 528 · PAS · orden 600500 (25/10/2026)."],r:"RCS pág. 35, 86 · PBB 504 pág. 35, 86"},
   {t:"Capota no despliega / no recoge",g:[26, 47, 59, 26],p:["E-A0 disyuntor capota apagado → E-Q4 (izq) / E-Q4.1 (dcha), 2,15 A.","Inversores E-K41/42 (izq) y E-K43/44 (dcha), órdenes desde E-A1 OUT12-15.","FC capota C-S15/C-S16 (E-A2 DIN12/13): encendido = capota echada.","Motores C-M4 / C-M4.1 (0,5 kW)."],r:"pág. 26, 47, 55, 59"},
   {t:"Portón enrollable · bloqueo de traslación",g:[27, 68, 68, 68],p:["E-Q8 (1,1 A) → E-K81/2 (E-A1 OUT31/32 subir/bajar) → motor C-M6.","Sensor portón abajo C-S9 (E-A8). Si falla, la PBB no rearma.","BLOQUEO DE LA PAS: con el portón arriba la pasarela queda bloqueada. Antes de una traslación hay que BAJAR el portón para quitar el bloqueo. La llave de bypass NO elimina este bloqueo.","Solo para OT de portón: si el portón está COMPROBADO abajo y cerrado y C-S9 no lo detecta → puente provisional E-A8 1.1–1.2 y revisar sensor C-S9 (distancia, soporte, cable)."],r:"pág. 27, 57, 68"},
   {t:"Sirena de cabina · fallo sensor sirena (alarma 138) y barrera de rotonda",g:[91,70,54,70,69,91,91,91,89,91],a:"No se puentea el sensor de la sirena (E-A9 4.1–4.2) ni la barrera de rotonda: son entradas de seguridad. Si la sirena está averiada, se sustituye.",p:[
"QUÉ HAY (ESQUEMA GENERAL rev. J folio 91): sirena de seguridad de cabina C-H41, manguera EC-W20 (7×1,5) hasta la regleta E-X70. Alimentación 24 V: X3:1 (+24 V, cable 613, hilo 3) y X3:3 (0 V, cable 205, hilo 4). MANDO desde la salida de seguridad E-A6 módulo 4 (LED 1, bornas 7.1/7.3/7.4) por los cables 664/665 (hilos 1 y 2) a X1:3 / X1:5. SENSOR DE LA SIRENA (confirma que suena): salida de test E-A9 4.2 (UT2, cable 667, hilo 5) → X3:5 IN → X3:7 OUT → hilo 6 → cable 666 → entrada E-A9 4.1 (IN04S, módulo 2 LED 2).",
"CUÁNDO SUENA (alarmas de la Magelis): 140 «Acceso por puerta de servicio no autorizado» (inductivo SS-B15, E-A10 módulo 2 LED 2) → el PLC de seguridad manda la sirena. Si a los pocos segundos salta 138 «Fallo sensor sirena», el PLC mandó la sirena y no recibió la confirmación por E-A9 4.1 (o la recibe sin orden). La 138 queda ENCLAVADA aunque se cierre la puerta, y la sirena sigue activada. Caso registrado: PBB 579 · PAS · orden 600600 (alarmas del 24/10/2026: 140 → 141 → 138).",
"RELACIÓN CON EL PORTÓN: en los planos no hay ningún contacto de la sirena en el circuito del portón (E-Q8 → E-K81/82, E-A1 módulo 4 LED 7/8). Pero con la 138 activa (o la 141 «Esperando autorización remota») el PLC puede no dar la orden. Comprobar: pulsar subir portón → P-A4 módulo 3 LED 1 → E-A1 módulo 4 LED 7 → entra E-K81. Si el LED 7 no se enciende, el bloqueo viene del PLC: resolver primero la 138/141. Si se enciende y el portón no sube → avería del portón (E-K81, motor C-M6, mecánica).",
"PRIORIDAD 1 · Puerta de servicio CERRADA y SS-B15 detectándola (E-A10 módulo 2 LED 2 ●). Alarma 141 activa: selector CP-S16 de REMOTO a LOCAL y otra vez a REMOTO, y pedir autorización a CGA si está en remoto. Rearmar la PBB desde el pupitre y comprobar en la Magelis que la 138 pasa a «Desactivado».",
"PRIORIDAD 1 · Cotejar orden y realimentación: E-A6 módulo 4 LED 1 (orden de sirena) y E-A9 módulo 2 LED 2 (sensor de sirena). En reposo los dos apagados. Orden sin realimentación → la sirena no confirma (paso de medidas). Realimentación sin orden → cruce en EC-W20 / E-X70 o sensor de la sirena dañado.",
"PRIORIDAD 2 · Medidas del bucle del sensor (polímetro): 24 V entre X3:1 y X3:3 (hilos 3 y 4 de EC-W20). Test E-A9 4.2 (UT2) ≈24 V, igual en E-X70:24 (cable 667) y en X3:5 IN (hilo 5). X3:7 OUT → E-X70:25 (hilo 6) → E-A9 4.1 (cable 666): mismo valor en los tres puntos (0 V en reposo). X3:7 con tensión y 4.1 sin ella → hilo 6 de EC-W20 o cable 666. X3:5 con 24 V y X3:7 sin cambiar al sonar → sensor interno de la sirena.",
"PRIORIDAD 2 · Medidas del mando: con orden (E-A6 módulo 4 LED 1 ●) medir 24 V entre X1:3 y X1:5 (hilos 1 y 2, cables 664/665). Llega tensión y no suena → sirena C-H41 averiada: sustituir. Suena sin orden → cruce o humedad en EC-W20 / E-X70.",
"PRIORIDAD 2 · En cabina, revisar los conectores X1 y X3 de C-H41 (humedad, pines flojos o doblados) y el apriete de EC-W20 en la regleta E-X70 del armario E.",
"BARRERA DE ROTONDA (evento 294 «Barrera de rotonda activada»): emisores R-B1 / R-B3 y receptores R-B2 / R-B4 → E-A10 módulo 2 LED 1, que debe estar ENCENDIDO FIJO. Test de la barrera desde E-A1 módulo 2 LED 8 ●. Si el evento se activa y desactiva varias veces en pocos segundos: ópticas sucias o desalineadas, soporte flojo, cable dañado o algo que corta el haz en la rotonda. Limpiar ópticas, realinear y comprobar que el LED queda fijo.",
"CIERRE: rearmar, comprobar en la Magelis que 138 y 140 quedan desactivadas y que la barrera de rotonda no genera eventos, probar la sirena (suena y se confirma) y subir/bajar el portón. Dejar el portón ABAJO antes de cualquier traslación."],r:"RCS pág. 54, 64, 69, 70, 89, 91"},
   {t:"Bloqueada por equipos de servicio (A/A, 400 Hz, carro)",g:[58, 12, 60, 11],p:["PRIORIDAD 1 · EN EL EQUIPO: cerrar la puerta del carro A/A (ajuste del FC E-S100), parar la PCA o el 400 Hz y recoger manguera, cable o conector.","PRIORIDAD 2 · DESBLOQUEO EN EL MÓDULO DEL PLC: con el equipo COMPROBADO parado y recogido, en E-A2 soltar el hilo de la entrada del bloqueo activado (no puentear): máquina A/A borna IN 4.4 · carro A/A borna IN 5.1 · convertidor 400 Hz borna IN 6.1 · 90 % conector borna IN 5.4. Anotarlo en la OT y reponerlo al reparar.","E-A2 en reposo deben estar apagados: bloqueo máquina A/A (DIN08), carro A/A (DIN09), convertidor en servicio (DIN10), 90 % conector (DIN11).","Carro PCAir: final de carrera E-S100.","Seta AO (E-A3 DIN01) / bypass AO (DIN02).","Equipo parado y bloqueo activo → revisar manguera CBTH-X61 ↔ E-X61 y el contacto en el equipo."],r:"pág. 11-12, 58-60"},
   {t:"Zapata / bordes / bumpers",g:[45, 41, 92],p:["Zapata C-B4 → Gelbau P-U5 → E-A10 DIN08. Ver LEDs de P-U5 y cable CP-W14.","Bordes ruedas T-B5/T-B6 → E-U5.","Bumpers brazo y cabina C-B27…C-B30 → E-A10 DIN01/02."],r:"pág. 41, 45, 92"},
   {t:"Iluminación, enchufes, caldeos, lunetas",g:[19, 23, 21, 18],p:["Interior: E-Q10 + E-K10 / E-K18. Exterior/cabina: E-Q10.1. Focos: E-Q15.1 + E-K15.","Enchufes sin tensión → diferencial E-Q13 (30 mA): buscar derivación antes de rearmar.","Caldeo: E-Q12 + E-K60, termostato E-B4. Lunetas: E-Q17.1 + E-K17.","Cae todo el monofásico → E-Q150 o E-K0.1."],r:"pág. 18-28"},
   {t:"Cámaras, display, comunicaciones",g:[93, 49, 71],p:["Switch E-V1 (MikroTik PoE) por E-Q18 (6 A 30 mA) → fuente 48 V E-X4.1.","Display CP-A1 a 24 V desde P-X92 / P-X53.","Sin comunicación pupitre ↔ armario → Interbus E-A11 ↔ P-A0 (cable EP-W3)."],r:"pág. 49, 71-72, 93-95"},
   {t:"Sistemas auxiliares · megafonía",cro:"mega",g:[30,30,30,29,10,30,30,30],a:"La megafonía no bloquea la pasarela: es un equipo auxiliar. Se repara sin dejar la PBB fuera de servicio salvo que lo pida CGA.",p:[
"QUÉ HAY (ESQUEMA GENERAL rev. J folio 30): central de megafonía E-V5 (amplificador FONESTAR, armario E). Alimentación 230 V por E-Q25 (2P 6 A) → E-X53:1-2 (hilos 160/161), tierra E-X91:5. Entrada de audio E1/E2 desde E-X78:1-2. Encendido remoto E3/E4 a 24 VDC. Salida S1/S2 a 4 altavoces: IT-B20 e IT-B21 (túnel interior), ET-B20 (ronda) y MT-B20 (túnel medio, solo PBB de 3 túneles).",
"PRIORIDAD 1 · ¿E-V5 encendido (display y piloto del frontal)? Si está apagado: E-Q25 cerrado y 230 V entre E-X53:1 (hilo 160) y E-X53:2 (hilo 161). E-Q25 cuelga de la misma línea de 230 V que E-Q24 (frenos) y E-Q26 (hilos 1/10): si tampoco hay tensión ahí, subir a E-S0.1 / alimentación SAI del CBTH (folio 29).",
"PRIORIDAD 1 · Encendido remoto: E-V5 se activa con 24 VDC en REMOTE E3/E4 a través del contacto E-S3 (13-14). Medir 24 VDC entre E-X66:3 (hilo 204) y E-X66:4 (hilo 205). Sin tensión → contacto E-S3 abierto o falta de 24 VDC de E-Q30. Cable E-W18 (2×1,5 FR) hasta la central.",
"PRIORIDAD 1 · Señal de audio: pedir a CGA un aviso de prueba. La señal viene del CBTH por CBTH-X60:7-8 → manguera PCBTH-W1 → P-X60:7-8 (pupitre) → cable apantallado EP-W11 → E-X78:1-2 (hilos 6011 / 171, malla en E-X78:3) → E1/E2 de E-V5. Sin señal en E-X78 → medir en P-X60:7-8; sin señal tampoco ahí → origen en el CBTH / megafonía del aeropuerto.",
"PRIORIDAD 2 · Ruido o zumbido: revisar la malla de EP-W11 conectada a tierra solo en E-X78:3 y el apriete de E-X78:1-2. Un cable de audio sin malla o con la malla a dos tierras mete zumbido.",
"PRIORIDAD 2 · Suena una zona y otra no: la salida S1/S2 (hilos 163/164) va a E-X63:1-2 y de ahí salen tres ramas en paralelo: túnel interior (EIT-W2 → IT-X52:1-2 → IT-W12 a IT-B20 e IT-W12.1 a IT-B21), ronda (E-W1 → ET-B20) y túnel medio (EMT-W2 → MT-X51:1-2 → MT-W3 → MT-B20). Revisar la regleta de paso y el altavoz de la rama muda.",
"PRIORIDAD 2 · No suena ningún altavoz con E-V5 encendido y señal en E1/E2: revisar volumen y selección de entrada en el frontal. Si la central se protege, soltar las ramas en E-X63 una a una para localizar un cortocircuito y medir continuidad de cada rama con la central desconectada.",

"CÓMO FUNCIONA (OPERATIVA): pines de potencia A, B, C y N (retorno); pines de control E y F, más cortos: la potencia solo se activa con el conector insertado al 90 % o más y se corta antes de que se separen A, B, C.",
"Aproximación: pulsar OUT para soltar la manguera necesaria, sin forzar el cable.",
"Inspección visual del conector PDS 400 y del receptáculo del avión: sin humedad, quemaduras ni pines doblados.",
"Insertar el conector a fondo hasta el tope (90-100 %) y comprobar que se enciende el LED amarillo 90 % / 28 Vdc.",
"Pulsar ON. La motorización de la manguera queda bloqueada por seguridad.",
"Confirmación en cabina: la luz «EXT PWR» del avión pasa de Available a On.",
"Desconexión: pulsar OFF y comprobar que se apaga el LED rojo ON.",
"Retirar el conector del avión a mano.",
"Recogida con el conector DESCONECTADO: fuera de la zona de peligro del motor, recoger solo con el botón IN del propio conector, acompañando la manguera (por operativa del aeropuerto no puede arrastrarse por el suelo). Al quedar 4 m para el final del recorrido, terminar la recogida desde el armario AO.","Recogida con el conector INSERTADO en el avión: solo con el botón IN del conector + desbloqueo de PAS en el armario AO (el IN del AO no opera, seguridad de arrastre). Ver «Recogida de la manguera 400 Hz»."],r:"OPERATIVA conector HZ PDS400 · PDS 400"},
   {t:"Recogida de la manguera 400 Hz · conector insertado o desconectado · armario AO (recoge IN)",op:1,g:[0,0,0,0,0,0,0,0],a:"Con el conector PDS 400 INSERTADO en el receptáculo del avión, la orden de recoger (IN) en AO no opera. Es una seguridad implementada para no arrastrar el conector por el suelo. No es avería.",p:[
"HOMBRE MUERTO (OPERATIVA conector HZ PDS400): los pulsadores IN y OUT no se enclavan; solo hay señal en los cables 2 (IN) o 3 (OUT) mientras se mantiene pulsado y con el desbloqueo de la pasarela activado. Con el conector insertado en el receptáculo del avión, IN funciona con la pasarela desbloqueada desde el selector del AO. Así el operario supervisa que la manguera no se enrede ni golpee a nadie.",
"CONECTOR INSERTADO EN EL AVIÓN: la recogida SOLO se puede hacer con el botón IN del conector + desbloqueo de PAS en el armario AO. Pasos: 1) desbloqueo de PAS con el selector del AO; 2) botón IN del conector, mantenido pulsado.",
"CONECTOR DESCONECTADO DEL RECEPTÁCULO: recoger siguiendo la operativa solo con el botón IN del propio conector, acompañando la manguera. Por operativa del aeropuerto la manguera no puede ir arrastrándose por el suelo, para no deteriorar el conector por fuera.",
"FINAL DE LA RECOGIDA: cuando quedan 4 m para llegar al final del recorrido (enrolle en el recogedor), la recogida se termina desde el armario AO.",
"Señales en la PBB (ESQUEMA GENERAL rev. J y plano PBB 504/508, folio 11 · interfaz CBTH-X61 ↔ E-X61, manguera ECBTH-W): desbloqueo PBB AO → E-X61:13 → E-A3 DIN02 (borna 2.1, «BYPASS AO», folio 60) · convertidor en servicio → E-X61:14 → E-A2 DIN10 (6.1, folio 59) · 90 % conector → E-X61:15 → E-A2 DIN11 (5.4, folio 59) · seta AO → E-X61:16 → E-A3 DIN01 (1.1, folio 60).",
"Cable 400 Hz extendido: contacto «-400HZ» 13-14 → P-A5 DIN02 (borna 2.1, folio 85): encendido con la manguera fuera; al terminar la recogida en el recogedor debe apagarse. Si sigue encendido con la manguera recogida → contacto -400HZ o su hilo.",
"Si con el desbloqueo de PAS en el AO + IN del conector tampoco recoge: OFF pulsado y LED rojo ON apagado, disparo de PTC (hilos 1-14) y sensor 90 % «pegado» (hilos 9-13); después ver «Manguera no recoge (IN) o no suelta (OUT)».",
"PBB 507 (A380): su interfaz CBTH-XB2 ↔ E-X61 solo trae la seta AO (folio 21); el plano de la pasarela no tiene señales de convertidor en servicio ni de 90 %. La operativa de recogida es la misma."],r:"Operativa de recogida (aeropuerto) · OPERATIVA conector HZ PDS400 · ESQUEMA GENERAL rev. J folios 11, 59, 60, 85"},
   {t:"LED 90 % no enciende / no da potencia (lazo de seguridad E-F, 28 Vdc)",op:1,g:[0,0,1,1,1,1],p:[
"CÓMO FUNCIONA (OPERATIVA): el convertidor envía 28 Vdc por el pin F; en el receptáculo del avión un puente une F con E; la señal vuelve por E. Solo con los 28 V de vuelta cierra el contactor de potencia y da tensión a A, B y C. LED verde «Available / 28 Vdc» = lazo E-F cerrado; LED rojo «Power ON» = contactor cerrado.",
"Si el LED 90 % no enciende, NO pulsar ON.",
"Comprobar que el conector ha llegado al tope mecánico del receptáculo.",
"Limpiar y revisar los pines cortos E y F (suciedad, desgaste, pin hundido).",
"Interruptor 90 %: continuidad entre los hilos 9 y 13 de la manguera con el conector a fondo (plano PDS 400). Abierto → interruptor dañado o sus hilos.",
"Si el conector se mueve hacia fuera, E o F pierden contacto y la potencia se corta: revisar el anclaje si se corta durante el servicio."],r:"OPERATIVA conector HZ PDS400 · PDS 400"},
   {t:"Manguera no recoge (IN) o no suelta (OUT) · enrollador motorizado",op:1,g:[1,0,0,0,1,1],p:[
"PRIMERO: ¿el conector sigue INSERTADO en el avión? Con el conector insertado el IN del AO no opera por seguridad (no es avería): recoger solo con el botón IN del conector + desbloqueo de PAS en el armario AO.","IN y OUT mueven el motor del enrollador (no el contactor de 400 Hz). Según el plano PDS 400: IN = hilo 2 (unido al 16), OUT = hilo 3 (unido al 23), común hilo 9. Confirmar en el plano: la OPERATIVA nombra el cable 3 para OUT y también para el bloqueo de IN.",
"IN no recoge: pulsar OFF y comprobar que el LED rojo ON se ha apagado del todo. Con potencia activa IN queda bloqueado.",
"Sensor 90 % «pegado»: el convertidor cree que sigue conectado al avión y bloquea el motor. Comprobar que el LED 90 % se apaga con el conector fuera; si no, interruptor 90 % (hilos 9-13).",
"Hombre muerto: IN y OUT solo funcionan mientras se mantiene pulsado y con el desbloqueo de la pasarela activado.",
"Sobretemperatura: si las PTC de los pines A, B, C o N han disparado, se bloquean todas las funciones (también la motorización) hasta que se enfríe o se resetee. Medir resistencia entre hilos 1 y 14.",
"Si sigue sin moverse con todo lo anterior correcto: continuidad del botón IN/OUT con el común 9 (ver «Botón del mando no responde»)."],r:"OPERATIVA conector HZ PDS400 · PDS 400"},
   {t:"Convertidor sin salida / bloqueo 90 % conector",g:[1, 1, 1],p:["Conector con interruptor de enclavamiento al 90 % (28 Vdc): comprobar inserción completa.","Interruptor «INTERLOCK» 90 % (2 hilos GR) entre los hilos 9 (común, unido al 24) y 13 (unido al 22) de la manguera de 24: conector metido = continuidad 9-13. Abierto con el conector a fondo → interruptor o sus hilos.","En la PBB, E-A2 DIN10 (convertidor en servicio) y DIN11 (90 % conector)."],r:"PDS 400"},
   {t:"Botón del mando no responde (IN / OUT / ON / OFF)",g:[1, 1, 1, 1, 1, 1, 1],p:["Identifica el botón que falla en el frontal del conector y búscalo en el plano PDS 400. Cada botón une su hilo con el común, hilo 9 (en el plano unido también al 24). Cables del botón: azul (BL).","IN (negro): hilo 2 (unido al 16) ↔ común 9.","OUT (negro): hilo 3 (unido al 23) ↔ común 9.","ON (verde): hilo 4 (unido al 17) ↔ común 9.","OFF (rojo): hilo 5 (unido al 18) ↔ común 9.","Prueba: polímetro en continuidad entre el hilo del botón y el 9 en la regleta de 24: pulsado ≈0 Ω, suelto abierto. Si no cierra, mide en los dos pines del propio botón: si ahí cierra, es el hilo o el pin de la regleta (revisa también el pin unido: 16, 23, 17 o 18).","Si no responde ningún botón: común hilo 9 / 24 cortado o pin 9 flojo (el mismo común lleva pilotos e interruptor 90 %)."],r:"PDS 400"},
   {t:"Piloto del mando no enciende (LED ON / 28 Vdc / 90 %)",g:[1, 1, 1, 1],p:["LED ON (rojo): hilo 6 (azul) ↔ retorno rojo al común 9.","LED 28 Vdc (verde): hilo 7 (azul) ↔ retorno rojo al común 9.","Piloto «security» / 90 % (amarillo): hilo 8 (azul) ↔ retorno rojo al común 9.","Mide tensión entre el hilo del piloto y el 9 con la condición activa: hay tensión y no luce → piloto fundido; sin tensión → hilo, pin o el convertidor no da la señal."],r:"PDS 400"},
   {t:"Disparo por temperatura en conector",g:[1, 1, 1],p:["Sondas PTC 100 en las fases A, B, C y N, en serie entre los hilos 1 (unido al 20) y 14 (unido al 19) de la manguera de 24.","Mide resistencia entre 1 y 14 con el conector frío: abierta o muy alta → sonda disparada, cortada o pin quemado; mide cada sonda por separado. Revisa pines de fase quemados o flojos.","Pines de control: F (tornillo) y E azul al hilo 10 (unido al 11); E blanco al hilo 15. En pupitre, P-A5 DIN02 indica cable 400 Hz extendido."],r:"PDS 400"}]},

function alDe(i){const m={};AAP_EQ.forEach(k=>m[k]=[]);if(!i)return m;
 if(i.alAire){AAP_EQ.forEach(k=>m[k]=AAP_AL.filter(x=>(i.alAire[k]||[]).includes(x)))}
 else if(AAP_EQ.includes(i.aap)){m[i.aap]=AAP_AL.filter(x=>(i.alarmas||[]).includes(x))}
 return m}

 const l=(i.act||"").split("\n").filter(x=>!/^Alarma AA[CR]: /.test(x));eq.forEach(k=>l.push(`Alarma ${k}: ${c[k].join(", ")}`));

/* --- texto: limpieza para fuentes PDF estándar --- */
function iaGTxt(s){return String(s||"").replace(/\*\*|__|`/g,"").replace(/[→⟶➜]/g,"->").replace(/[←]/g,"<-").replace(/[↔]/g,"<->").replace(/[●◉]/g,"(on)").replace(/[○]/g,"(off)").replace(/[◐]/g,"(var)").replace(/[⚠️]/g,"").replace(/[✕✖×]/g,"x").replace(/[≈]/g,"~").replace(/[≥]/g,">=").replace(/[≤]/g,"<=").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x00-\xFF·–—…€]/g,"").replace(/\s+/g," ").trim()}
function iaGNorm(s){return iaGTxt(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

/* --- análisis y reordenación de la actuación guiada --- */
const IAG_FASES=[
 {k:"prep",t:"Preparación y seguridad",re:/\b(cga|n[ºo°]? ?de orden|baliz|sin avion|coordina|responsable de turno|bloquea y etiqueta|selector)\b/},
 {k:"rep",t:"Reparación",re:/\b(sustituye|sustituir|repara|reparar|reaprieta|aprieta|cambia|cambiar|reemplaza|limpia|limpiar|alinea|ajusta)\b/},
 {k:"cierre",t:"Prueba funcional y cierre",re:/(prueba funcional|prueba en manual|prueba los movimientos|prueba todos|presiona cada|al soltar|hora de cierre|cierra la ot|cierre de la actuacion|anota en la ot)/},
 {k:"med",t:"Medidas y localización del fallo",re:/(\bmide\b|\bmedir\b|medida|continuidad|polimetro|tramo|corta el mando|[a-z]-x\d+(\.\d+)?:\d)/},
 {k:"plc",t:"Comprobación en armario / PLC",re:/(\bled\b|\bleds\b|e-a\d|\bplc\b|alimentacion|24 ?v|modulo|disyuntor|magnetotermico|rearma)/},
 {k:"vis",t:"Inspección visual",re:/(inspecciona|visual|a simple vista|\bmira que\b|aplast|deform|golpe|enganch|prensaestopa)/}];

function iaGParse(txt){
 const L=String(txt||"").replace(/\r/g,"").split("\n");
 const R={avisos:[],diag:[],notas:[],notasSec:[],pasos:[],tablas:[]};let sec="",sub="",last=null,tab=null;
 const esDiag=()=>/diagn|causa|explica|por que|funcionamiento/.test(iaGNorm(sec));
 let lvl=0;const esNota=()=>!sec||lvl==1;const esPasoSec=()=>/primera|actuacion|secuencia|medida|prueba|procedimiento|pasos|comprobac|en campo|localiza|reparac|cierre/.test(iaGNorm(sec)+" "+iaGNorm(sub));
 let loc=null;const addPaso=(t,ctx)=>{const p={t:t,sub:[],sec:sec+"|"+sub,ctx:ctx||sub,loc:loc};loc=null;R.pasos.push(p);last=p};
 const addAviso=t=>{t=iaGTxt(t);if(t&&!R.avisos.some(a=>iaGNorm(a)==iaGNorm(t)))R.avisos.push(t)};
 for(let raw of L){const line=raw.replace(/\t/g,"    ");const s=line.trim();
  if(!s){tab=null;continue}
  if(/^\|/.test(s)){const cells=s.replace(/^\||\|$/g,"").split("|").map(c=>iaGTxt(c));if(cells.every(c=>/^:?-{2,}:?$/.test(c)||c===""))continue;
   if(!tab){tab={titulo:iaGTxt(sec)||"Referencias",filas:[]};R.tablas.push(tab)}tab.filas.push(cells);continue}
  tab=null;
  let m;
  if(m=s.match(/^(#{1,6})\s+(.*)/)){lvl=m[1].length;sec=m[2];sub="";last=null;continue}
  if(m=s.match(/^\*\*([^*]{2,60})\*\*:?$/)){sub=iaGTxt(m[1]);last=null;continue}
  if(/^(---|\*\*\*)$/.test(s))continue;
  const ind=(line.match(/^\s*/)[0]||"").length;
  if(m=s.match(/^(\d+)[.)]\s+(.*)/)){const t=m[2];
   if(ind>=2&&last){last.sub.push(iaGTxt(t));continue}
   if(esDiag()){iaGSplitPaso(t,x=>R.diag.push(x),addAviso);continue}
   if(esNota()){R.notas.push(iaGTxt(t));continue}
   loc=+m[1];iaGSplitPaso(t,addPaso,addAviso);continue}
  if(m=s.match(/^[-*•]\s+(.*)/)){const t=m[1];
   if(last&&(ind>=2||/:\s*$/.test(last.t))){last.sub.push(iaGTxt(t));continue}
   if(esDiag()){iaGSplitPaso(t,x=>R.diag.push(x),addAviso);continue}
   if(esPasoSec()){iaGSplitPaso(t,addPaso,addAviso);continue}
   R.notas.push(iaGTxt(t));if(!esNota())R.notasSec.push(iaGTxt(t));continue}

  if(esDiag()){iaGSplitPaso(s,x=>R.diag.push(x),addAviso);continue}

  iaGSplitPaso(s,x=>{R.notas.push(x);if(!esNota())R.notasSec.push(x)},addAviso)}
 /* texto libre sin pasos: cada línea es un paso */
 if(!R.pasos.length&&R.notas.length){R.notas.forEach(t=>R.pasos.push({t:t,sub:[],sec:"",ctx:"",loc:null}));R.notasSec=R.notas.slice();R.notas=[]}
 /* sin duplicados */

 /* clasificar y reordenar */
 R.pasos.forEach((p,ix)=>{p.ix=ix;const n=iaGNorm(p.t+" "+p.sub.join(" "));const v=iaGNorm(p.t).split(/[\s,.:;]/)[0];const V={mide:"med",medir:"med",corta:"med",repite:"med",sustituye:"rep",repara:"rep",cambia:"rep",reaprieta:"rep",inspecciona:"vis",coordina:"prep",baliza:"prep",presiona:"cierre",prueba:"cierre"};const f=V[v]?IAG_FASES.find(f=>f.k==V[v]):IAG_FASES.find(f=>f.re.test(n));p.fase=f?f.k:"plc"});
 R.fases=IAG_ORDEN.map(k=>({k:k,t:IAG_FASES.find(f=>f.k==k).t,pasos:R.pasos.filter(p=>p.fase==k).sort((a,b)=>a.ix-b.ix)})).filter(f=>f.pasos.length);
 let n=0;R.fases.forEach(f=>f.pasos.forEach(p=>p.n=++n));
 /* «sigue con el paso 2» -> número nuevo dentro del mismo apartado */
 R.pasos.forEach(p=>{const mapa=k=>{const q=R.pasos.find(x=>x.sec==p.sec&&x.loc==+k);return q?q.n:k};const fx=s=>s.replace(/\b(paso|pasos)\s+(\d+)/gi,(a,w,k)=>w+" "+mapa(k));p.t=fx(p.t);p.sub=p.sub.map(fx)});

function iaGSplitPaso(t,addPaso,addAviso){
 /* frases de advertencia («No puentees…», «Nunca…», ⚠) van al recuadro ATENCIÓN; la frase explicativa que las sigue va con ellas; el resto queda donde estaba */
 const raw=String(t||"");const fr=iaGTxt(raw).split(/(?<=[.!])\s+(?=[A-ZÁÉÍÓÚÑ¿])/);const resto=[];let av=null;

 fr.forEach(f=>{if(esAv(f)){if(av)addAviso(av);av=f}else if(av&&/^(la|el|lo|los|las|es|son|est[aá]|esto|ya que|porque)\b/i.test(f)){av+=" "+f}else{if(av){addAviso(av);av=null}resto.push(f)}});
 if(av)addAviso(av);
 if(resto.length)addPaso(resto.join(" "))}

const IAG_REF=/\b((?:CBTH|EIT|EET|ESS|EP|EH|EC|ITR|ITCO\d|CP|IT|ET|MT|SS|CO\d?|[EPCHTR])-[A-Z]{1,3}\d+(?:\.\d+)?'{0,2})(?![A-Za-z0-9])(?::(\d+)(?:\s*[–\-]\s*(\d+))?)?/g;
function iaGRefs(txt,R){
 const refs={};let m;
 /* solo cuenta lo que se usa en la actuación: pasos, avisos, diagnóstico y tablas (no las notas de alcance) */

 while(m=rm.exec(t)){const r=refs[m[1]]||(refs[m[1]]={id:m[1],bornas:new Set(),puntos:new Set(),pasos:new Set()});r.puntos.add("mód."+m[2]+(m[3]?" "+m[3]:""))}
 Object.values(refs).forEach(r=>{const p=[...r.puntos];p.filter(x=>!/\d\.\d$/.test(x)&&p.some(y=>y!=x&&y.startsWith(x+" "))).forEach(x=>r.puntos.delete(x))});

 (R.pasos||[]).forEach(p=>{const s=p.t+" "+p.sub.join(" ");Object.values(refs).forEach(r=>{const re=new RegExp("\\b"+r.id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\d.])");if(re.test(s))r.pasos.add(p.n)})});

function iaGZona(id){const pre=id.split("-")[0],ty=(id.split("-")[1]||"")[0];

/* --- croquis --- */
function iaGCroquisAlto(refs){const z={};refs.forEach(r=>{const k=iaGZona(r.id);(z[k]=z[k]||[]).push(r)});const n=k=>(z[k]||[]).length;

function iaGCroquis(d,x0,y0,W,H,refs){

 let cx=x0+3;const top=y0+9,bot=y0+H-3;const box={};

 d.setFont("helvetica","normal");
 const badge=(r,x,y)=>{if(!r.pasos.size)return;const s="P"+[...r.pasos].sort((a,b)=>a-b).slice(0,4).join(",");d.setFontSize(6);const tw=d.getTextWidth(s)+2.4;d.setFillColor(...AC);d.roundedRect(x,y-2.6,tw,3.4,1,1,"F");d.setTextColor(255,255,255);d.text(s,x+1.2,y);d.setTextColor(30,30,30)};
 const anc={};/* anclajes: id -> {x,y,bornas:{n:[x,y]}} */

 const regleta=(r,x,y,w,lado)=>{const bs=[...r.bornas].sort((a,b)=>a-b);d.setFontSize(7);d.setFont("helvetica","bold");d.setTextColor(20,20,20);d.text(r.id,x,y);badge(r,x+d.getTextWidth(r.id)+1.5,y);d.setFont("helvetica","normal");
  const a={x:x,y:y,b:{}};if(!bs.length){anc[r.id]=a;return y+5}
  const bw=Math.min(6.2,(w-2)/Math.min(bs.length,8));let bx=x,by=y+2;

  anc[r.id]=a;return by+8};
 const pieza=(r,x,y,w,fill)=>{d.setDrawColor(...PR);d.setFillColor(...(fill||[250,248,253]));d.roundedRect(x,y,w,6.5,1,1,"FD");d.setFontSize(7);d.setFont("helvetica","bold");d.setTextColor(20,20,20);d.text(r.id,x+1.5,y+4.3);d.setFont("helvetica","normal");
  if(r.puntos.size){d.setFontSize(5.8);d.setTextColor(...GR);d.text([...r.puntos].slice(0,3).join(" · "),x+1.5+d.getTextWidth(r.id)*7/5.8*0+0,y+8.6)}

 "<b>Resaltes de los extremos.</b> En cada extremo la banda sale hacia fuera (resalte) y deja libre la circunferencia de las pestañas. El resalte mide <b>70 mm (≈14°)</b>. Ese resalte pisa el rodillo del <b>único final de carrera de límite</b>, el mismo para derecha e izquierda: es el respaldo si un inductivo de límite no actúa.",
 "<b>Soporte fijo: 5 elementos.</b> Arriba el <b>FC de rodillo H-S1</b>, único, paro de giro en los dos sentidos. Debajo, 4 inductivos en <b>dos columnas</b>: columna izq. H-B3 (límite, fila alta frente a la banda lisa) + H-B1 (contaje, fila baja frente a las pestañas); columna dcha. H-B4 + H-B2. Las columnas están separadas <b>100 mm (medido) = 20°</b>, es decir 1 paso + 6°: el contaje da el sentido, pero los flancos quedan desiguales (6° y 1°). El PLC corta con el inductivo de límite ≈80,5° y, si falla, el resalte abre el FC ≈90,5° (unos 50 mm de giro después). Distancia inductivo–almena medida: <b>2 mm</b> (dentro de 1-4 mm).",
 "<b>Contaje (H-B1 · H-B2, altura baja).</b> Cuenta pestañas y huecos al girar las ruedas. Con esos pulsos el PLC calcula el ángulo de las ruedas respecto a la vertical. En E-A3 módulo 4, LED 3 y 4, parpadean al girar; en reposo pueden quedar encendidos o apagados.",
 "<b>Límite de giro (H-B3 izq. · H-B4 dcha., altura alta).</b> Tapados por la banda lisa en todo el giro; se liberan al llegar al resalte de su extremo. En E-A3 módulo 4, LED 1 y 2, encendidos y se apagan solo en el tope. Unos grados después, si el inductivo no ha cortado, el resalte abre el FC.",
 "<b>Límite de traslación.</b> Actuación más eficaz: ajustar los inductivos de final de giro H-B3 (izq.) y H-B4 (dcha.) para que detecten el final de la almena justo en el tope de diseño. Si uno corta antes que el otro, ese es el desajustado.",
 "<b>Ajuste.</b> <b>1 mm &lt; distancia &lt; 4 mm</b> entre la cara del sensor y la almena, en todo el giro (mejor hacia 2 mm). Por debajo de 1 mm roza; por encima de 4 mm pierde dientes o no detecta.",
 "<b>Cómo diagnosticar.</b> Girar despacio en manual y mirar a la vez el LED del sensor y el de E-A3. Cambian los dos → bien. Solo el del sensor → cableado (H-X51, EH-W1, E-X55). Ninguno → ajuste, almena o sensor."]},
 mega:{i:"🔊",f:30,t:"Cómo funciona la megafonía de la PBB",
 fl:[["Aviso de CGA / aeropuerto","CBTH-X60:7-8"],["PCBTH-W1","P-X60:7-8 (pupitre)"],["EP-W11 apantallado","E-X78:1-2 · malla E-X78:3"],["E-V5 · entradas E1/E2","amplificador FONESTAR"],["Salida S1/S2 · E-X63:1-2","3 ramas de altavoces FR 2×1,5"]],
 n:[
 "<b>Qué es.</b> Un amplificador (central E-V5) en el armario E que reproduce en la pasarela los avisos de megafonía que llegan del aeropuerto a través del armario CBTH.",
 "<b>Alimentación.</b> 230 V por E-Q25 (2P 6 A, curva C) → E-X53:1-2 → L/N de E-V5; tierra en la barra E-X91:5. E-Q25 comparte la línea de 230 V (hilos 1/10) con E-Q24 (frenos de traslación) y E-Q26.",
 "<b>Encendido remoto.</b> La entrada REMOTE (E3/E4) recibe 24 VDC desde E-Q30 a través del contacto E-S3 (13-14; qué elemento es E-S3 está pendiente de identificar en campo) y la regleta E-X66:3-4 (cable E-W18). Con el contacto abierto la central no se activa aunque tenga 230 V.",
 "<b>Audio.</b> El aviso entra por el CBTH-X60:7-8, sube al pupitre por la manguera PCBTH-W1 (P-X60:7-8) y baja al armario E por el cable apantallado EP-W11 hasta E-X78:1-2 (hilos 6011 / 171). La malla se conecta a tierra en E-X78:3.",
 "<b>Altavoces.</b> La salida S1/S2 (hilos 163/164) pasa por E-X63:1-2 y alimenta en paralelo 3 ramas con cable FR: túnel interior (IT-B20 e IT-B21 por IT-X52), ronda (ET-B20) y túnel medio (MT-B20 por MT-X51, solo PBB de 3 túneles).",
 "<b>Cómo diagnosticar.</b> Ir por orden: ¿encendida? (230 V en E-X53) → ¿activada? (24 VDC en E-X66:3-4) → ¿le llega audio? (aviso de prueba, E-X78:1-2) → ¿sale a la zona? (E-X63 y la rama). La primera comprobación que falle marca dónde está la avería."]},
 brazo:{sim:"brazo",img:"croquis/brazo-autonivelador-f86.png",f:86,t:"Croquis del brazo · secuencia de los inductivos",
 alt:"Tabla del folio 86: posición del brazo (>50, >25, 0, <25, <50 mm) frente a los sensores B8 a B13",
 n:[
 "<b>Cómo es en campo.</b> Bajo el suelo de la cabina, en la esquina delantera: un soporte horizontal con el motorreductor SEW (C-M2, brazo adelante / atrás) y, en su extremo, una pletina vertical que sube hasta la carcasa gris hexagonal. Arriba de la carcasa asoma la rueda de goma negra, que se apoya en el fuselaje y gira cuando el avión sube o baja. Dentro de la carcasa la rueda arrastra el disco que tapa o destapa los inductivos C-B8…C-B13. Los cables llegan por la manguera corrugada hasta el conector de la base del mástil.",
 "<b>Cómo se lee.</b> Columnas: sensores del brazo C-B8…C-B13 (arriba B8/B9, abajo B10/B11, neutral B12/B13). Filas: desnivel entre la cabina y la puerta del avión. Flecha ↑ = la cabina sube; ↓ = baja; 0 mm sin flecha = nivelada, cabina parada.",
 "<b>El punto gris</b> = entrada de P-A5 encendida. Los SICK IME12 son NC: entrada encendida = sensor <u>sin</u> leva delante. Sin punto = sensor tapado por la leva del brazo. Ajuste inductivo–leva: 1 mm &lt; distancia &lt; 4 mm.",
 "<b>Secuencia (sensores tapados):</b> &gt;50 mm → B8 B9 B10 B11 · &gt;25 mm → B9 B10 B11 · <b>0 mm → B10 B11 B12 B13</b> · &lt;25 mm → solo B10 · &lt;50 mm → ninguno.",
 "<b>Lógica:</b> los dos neutral (B12+B13) solo están tapados juntos en 0 mm. Al subir el avión se tapa primero B9 (&gt;25) y luego B8 (&gt;50). Al bajar se libera primero B11 (&lt;25) y luego B10 (&lt;50).",
 "<b>Para «sensores neutrales»:</b> en 0 mm los LED neutral de P-A5 (DIN14 borna 8.1 = B12 · DIN15 borna 7.4 = B13) deben estar los <b>dos apagados</b> a la vez, y encenderse los dos al salir de neutral hacia cualquier lado. Si uno no acompaña al otro → ese sensor, su latiguillo o su leva (ajuste 1-4 mm).",
 "<b>Combinación que no está en la tabla</b> (p. ej. B12 sin B13, o los cuatro de arriba/abajo libres a la vez) = sensor desajustado (fuera de 1-4 mm), leva desplazada o latiguillo M12 cortado.",
 "<b>Nota:</b> el plano no trae leyenda; esta lectura es deducida y coincide con el «LED en reposo» de la guía (arriba encendidos, neutral apagados). Si en campo ves lo contrario, avisa para revisar la guía."]}};

<script>
/* ===== v304: lista de técnicos sin cobertura (visto en un Android 7 al volver de reposo: «TypeError: Failed to fetch»).
   No era un fallo de la base de datos: el móvil no llegaba al servidor (sin datos o Wi-Fi dormido).
   · Se reintenta 3 veces (y se espera a recuperar la red) antes de dar error.
   · Se guarda la última lista buena en el móvil: sin conexión se usa esa y se avisa.
   · Si aun así falla: mensaje claro «sin conexión», botón «Reintentar» y reintento automático al volver la red
     (ya no dice que el administrador ejecute el SQL, que confundía). ===== */
(function(){
 const K="pbb_tec_cache",red=e=>/fetch|network|load failed|timeout|abort/i.test(String(e&&(e.message||e)||""));
 const espera=ms=>new Promise(r=>setTimeout(r,ms));
 const conRed=()=>navigator.onLine!==false?Promise.resolve():new Promise(r=>{const f=()=>{removeEventListener("online",f);r()};addEventListener("online",f);setTimeout(f,6000)});
 listaTec=async function(){let ult="";
  for(let k=0;k<3;k++){try{await conRed();const r=await sb.from("tecnicos").select("id,nombre,turno,activo").order("nombre");
    if(r.error){ult=r.error.message||String(r.error);if(!red(ult))return{err:ult}}
    else{const d=(r.data||[]).filter(x=>x.activo!==false);try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}return{data:d}}}
   catch(e){ult=String(e&&(e.message||e))}await espera(1200*(k+1))}
  try{const c=JSON.parse(localStorage.getItem(K)||"null");if(Array.isArray(c)&&c.length)return{data:c,offline:true}}catch(e){}

 const arregla=(fn,t)=>{const c=document.getElementById("sheetc");if(!c)return;

   m.innerHTML=`📶 <b>Sin conexión con el servidor.</b> Comprueba los datos móviles o el Wi-Fi. Se volverá a intentar solo al recuperar la red.<button class="pri" style="width:100%;margin-top:10px" onclick="${fn}('${t}')">Reintentar</button>`;m.style.color="#d32f2f";
   const f=()=>{removeEventListener("online",f);const s=document.getElementById("sheet");if(s&&s.style.display!="none"&&document.getElementById("sheetc").textContent.includes("Sin conexión"))window[fn](t)};addEventListener("online",f)}})};

  try{eval(fn+"=window."+fn)}catch(e){}});
})();
</script>
